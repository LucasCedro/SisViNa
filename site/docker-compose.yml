services:
  web:
    build:
      context: .
      args:
        VITE_APP_URL: ${VITE_APP_URL:-http://localhost:5173}
    image: viveiro-site:latest
    container_name: viveiro-site
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
    # env_file:
    #   - .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
