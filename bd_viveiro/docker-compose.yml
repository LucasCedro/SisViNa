services:
  postgres:
    image: postgres:15
    container_name: viveiro_postgres
    restart: always
    environment:
      POSTGRES_USER: viveiro_admin
      POSTGRES_PASSWORD: senha_segura_aqui
      POSTGRES_DB: viveiro_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - viveiro_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: viveiro_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@viveiro.com
      PGADMIN_DEFAULT_PASSWORD: admin_senha
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - viveiro_network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  viveiro_network:
    external: true
