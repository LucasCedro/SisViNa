services:
  web:
    image: node:20-alpine
    container_name: viveiro_web
    working_dir: /app
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      # Browser chama a API na máquina host (porta publicada pelo api_viveiro)
      - VITE_API_URL=http://localhost:8000
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    networks:
      - viveiro_network

volumes:
  web_node_modules:

networks:
  viveiro_network:
    external: true
