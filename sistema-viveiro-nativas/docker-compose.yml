services:
  web:
    image: node:20-alpine
    container_name: viveiro_web
    working_dir: /app
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    command: sh -c "if [ ! -d node_modules/vite ]; then npm ci; fi && npm run dev"
    networks:
      - viveiro_network

volumes:
  web_node_modules:

networks:
  viveiro_network:
    external: true
