# SisViNa — único ponto de entrada Docker (projeto: sisvina)
#
#   .\scripts\dev.ps1 start          Postgres + API
#   .\scripts\dev.ps1 start-all      + front em Docker
#   .\scripts\dev.ps1 start-demo     + site + PgAdmin
#   .\scripts\dev.ps1 stop
#   .\scripts\dev.ps1 migrate
#
# Front no dia a dia (recomendado): cd sistema-viveiro-nativas && npm run dev

name: sisvina

include:
  - path: compose/infra.yml
  - path: compose/api.yml
  - path: compose/web.yml
  - path: compose/site.yml

services:
  api:
    depends_on:
      postgres:
        condition: service_healthy

  web:
    depends_on:
      api:
        condition: service_started
