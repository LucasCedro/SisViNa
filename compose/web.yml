# Front Vue em Docker (profile docker-web). Dev diário: npm run dev na pasta do front.

services:
  web:
    image: node:20-alpine
    profiles:
      - docker-web
    working_dir: /app
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_SITE_URL: http://localhost:3000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ../sistema-viveiro-nativas:/app
      - web_node_modules:/app/node_modules
    command: sh -c "if [ ! -d node_modules/vite ]; then npm ci; fi && npm run dev -- --host 0.0.0.0"
    networks:
      - viveiro_network

volumes:
  web_node_modules:
