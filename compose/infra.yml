# Postgres + PgAdmin (profile tools). Rede e volumes definidos aqui.

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: viveiro_admin
      POSTGRES_PASSWORD: senha_segura_aqui
      POSTGRES_DB: viveiro_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../bd_viveiro/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viveiro_admin -d viveiro_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      viveiro_network:
        aliases:
          - viveiro_postgres
          - postgres

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@viveiro.com
      PGADMIN_DEFAULT_PASSWORD: admin_senha
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - viveiro_network

volumes:
  # Volume original do bd_viveiro — preserva dados de dev (não criar volume novo vazio)
  postgres_data:
    name: bd_viveiro_postgres_data
    external: true
  pgadmin_data:

networks:
  viveiro_network:
    name: viveiro_network
    external: true
